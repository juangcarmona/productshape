schema: spec-driven
context: >-
  This repository is ProductShape, the reference implementation of Product
  Definition as Code (PDaC).


  <!-- pdac:context begin -->

  This repository uses Product Definition as Code (PDaC). The canonical product
  definition lives in docs/product/model (actors, journeys, use cases, business
  rules, domain terms, bounded contexts, structured behaviours, and functional,
  quality and constraint requirements). OpenSpec artifacts consume it and are
  never a second source of truth.

  A citation binds consumer text to a canonical artifact: it records the
  artifact id, a sha256 content digest and an optional verification scenario
  anchor. Verification reports one status per citation: current, stale, tampered
  or unresolved.

  To cite: run `npx prodshape inspect <ID>` to read the current digest, then
  `npx prodshape cite --id <ID> --digest <digest>` to emit the canonical
  payload. Wrap it in the document's native comment (`<!-- ... -->` in Markdown)
  on its own line directly under the text it grounds.

  To find which artifacts a change impacts, compare the change's intent with the
  whole product definition first, then widen the result with `npx prodshape
  impact <ID>`. When the intent contradicts or goes beyond the definition,
  record that drift in the proposal with the marker `<!-- pdac-drift ids="..."
  summary="..." -->` (listed by `npx prodshape drift`) and let humans decide —
  never fix it quietly.

  Every current OpenSpec document (proposal, specs, design, tasks and
  openspec/specs/) carries exactly one explicit scope declaration: `pdac-scope:
  cited` for a bound document that carries at least one citation, or
  `pdac-scope: none` with a non-empty human-authored reason (`pdac-scope-reason:
  <why>` in frontmatter, or `<!-- pdac-scope: none reason="<why>" -->`) for an
  exempt one. Citations alone never bind: a document without a declaration is
  unclassified and fails verification, a bound document with zero citations
  fails, and an exemption without a reason or contradicted by citations fails.
  Binding and exemption are human declarations: never declare an exemption
  merely because citations are missing. Verify with `npx prodshape citations
  verify --provider openspec`: it enumerates the expected current documents, so
  zero discovered citations is a set of failures, never a pass. Archived changes
  are excluded by default; `--include-archived` also verifies the citations
  history carries, reported as warnings, because archived history cannot be
  edited.

  The accepted Product Definition changes only through a Product Change:
  validate it as an overlay while the baseline stays untouched, obtain human
  product approval (represented by status: approved; the integration verifies
  the state but cannot identify or judge the actor), apply explicitly on a
  working branch, and let a human accept the resulting baseline by merging its
  pull request. A Product Change is not a pull request; apply is not acceptance;
  neither apply nor merge attests implementation, verification, release or
  deployment. A Product Change lives under docs/product/changes/ or hosted
  inside a valid OpenSpec change created with the product schema
  (product-change/change.md plus product-change/proposed/**); its deterministically validated,
  apply-authorised apply is the only write path into docs/product/model. A
  spec-driven OpenSpec delivery change never edits docs/product/model directly:
  it may share a pull request with an applied Product Change or follow later,
  but it never supplies Product Change status.

  <!-- pdac:context end -->
rules:
  proposal:
    - "If this change's goals contradict the product definition, or need
      behaviour it does not describe, that is product-definition drift. Record
      it in the proposal under a 'Product definition drift' note naming the
      artifacts involved, with the marker `<!-- pdac-drift ids=\"<ID>[,
      <ID>...]\" summary=\"<one line>\" -->` on its own line so `npx prodshape
      drift` can list it. The decision is human: the developer and the product
      owner agree whether to propose a Product Change or adjust this change.
      Never fix drift quietly, drop or weaken a citation to hide it, or write
      around the conflict."
    - "Find the impacted artifacts as a separate step, before writing any
      proposal content. Read the whole product definition (docs/product/model by
      default), compare it with what this change wants — the backlog item behind
      it, if there is one — and list every artifact the change depends on,
      alters or contradicts. Then widen the list: run `npx prodshape impact
      <ID>` on each artifact you found and check its direct and indirect
      neighbours. Put the resulting list in the proposal, cite every impacted
      artifact from each document that uses it (proposal, specs, design, tasks),
      and name any neighbour you checked and left out."
    - State which PDaC artifacts this change touches, each with a citation
      payload emitted by `npx prodshape cite --id <ID> --digest <digest>` and
      wrapped in the document native comment (`<!-- ... -->` in Markdown). Never
      write a citation record by hand.
    - 'Every document of this change must end up bound or exempt, each with an
      explicit declaration: declare `pdac-scope: cited` on a line of its own and
      cite the canonical text the document depends on, or declare `pdac-scope:
      none` with a non-empty reason (`pdac-scope-reason: <why>` in frontmatter,
      or `<!-- pdac-scope: none reason="<why>" -->`) when a human judges the
      document has no product-semantic dependency. Citations alone never bind,
      and never declare an exemption just because citations are missing.'
    - If the change implements altered product behaviour, name the Product
      Change (CHG id) whose applied or accepted artifacts it implements. If no
      overlay-validated, apply-authorised Product Change exists yet, stop and
      ask for one instead of proceeding. A spec-driven OpenSpec change is not
      the Product Change; product intent travels through a Product Change, under
      docs/product/changes or hosted by a product-change OpenSpec change.
  specs:
    - Cite a specific verification scenario with an anchor when the requirement
      maps to one (anchor="<scenario id>").
    - Never paraphrase canonical text as if it were new; either cite it inline
      or embed it in a marker-block citation (<!-- pdac:cite ... --> canonical
      text <!-- /pdac:cite -->).
    - Never invent artifact ids or digests. Read them with `npx prodshape
      inspect <ID>`.
    - Every requirement derived from canonical product text MUST carry a
      citation to every PDaC artifact it derives from — not only the closest one
      — one citation per line, placed after the requirement text and before the
      first scenario. Never place citations between the requirement heading and
      the requirement text; OpenSpec reads the first paragraph as the
      requirement.
  design:
    - When a design decision depends on canonical product text, cite the
      artifact it depends on.
  tasks:
    - A task that changes cited behaviour must include a follow-up task to
      refresh the affected citations.
    - Never infer implementation, verification, release or deployment from
      Product Change status; record that evidence in the delivery workflow.
operations:
  apply:
    guidance:
      - "Before finishing, run `npx prodshape citations verify --provider
        openspec` and fix every stale, tampered or unresolved citation, every
        unclassified document, every bound document without citations and every
        exemption without a reason. Refresh a stale digest by re-running `npx
        prodshape inspect <ID>`; never delete a citation or declare `pdac-scope:
        none` to silence a diagnostic."
  archive:
    guidance:
      - Run `npx prodshape citations verify --provider openspec` one final time.
        Archive only when every document is bound or exempt and every citation
        is current.
