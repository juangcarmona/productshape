schema: spec-driven
context: >-
  This repository is ProductShape, the reference implementation of Product
  Definition as Code (PDaC).


  <!-- pdac:context begin -->

  This repository uses Product Definition as Code (PDaC). The canonical product
  definition lives in docs/product/model (actors, journeys, use cases, business
  rules, domain terms, requirements) and is the single source of truth for
  product behaviour. OpenSpec artifacts are downstream consumers of it, never a
  second source of truth.

  Consumers bind to canonical text through the PDaC Citation Contract: a
  citation records the target artifact id, a sha256 content digest, and an
  optional verification scenario anchor. Verification reports one status per
  citation: current, stale, tampered or unresolved.

  To cite: run `npx prodshape inspect <ID>` to read the current digest, then
  `npx prodshape cite --id <ID> --digest <digest>` to emit the citation record.
  Place inline citations on their own line directly under the text they ground.

  Mapping a change's intent to its impacted artifacts is semantic work: compare
  the intent against the entire product definition first, then expand the
  identified set structurally with `npx prodshape impact <ID>`. When the intent
  contradicts or exceeds the accepted definition, record that drift in the
  proposal as an explicit warning carrying the marker `<!-- pdac-drift ids="..."
  summary="..." -->` (enumerable with `npx prodshape drift`) for humans to
  resolve — never resolve it silently.

  Every current OpenSpec document (proposal, specs, design, tasks and
  openspec/specs/) has exactly one effective scope state: bound (it carries at
  least one citation, or declares `pdac-scope: cited`), exempt (a human declared
  `pdac-scope: none` because the document has no product-semantic dependency),
  or unclassified (neither declared — a verification failure). Binding and
  exemption are human declarations: never declare `pdac-scope: none` merely
  because citations are missing, and a document declared `pdac-scope: cited`
  with zero citations fails. Verify with `npx prodshape citations verify
  --provider openspec`: it enumerates the expected document population, so zero
  discovered citations is a set of failures, never a pass. The scope gate
  applies to current documents; archived changes' citations are still verified,
  with their defects reported as warnings because history is immutable and its
  drift is information.

  The accepted Product Definition changes only through this lifecycle: propose a
  Product Change under docs/product/changes/, validate its overlay while the
  baseline remains untouched, obtain human product approval, apply explicitly on
  a working branch, review the applied result in a pull request, and accept the
  resulting baseline by human merge. A Product Change is not a pull request.
  Apply is not acceptance, and neither apply nor merge attests implementation,
  verification, release or deployment. OpenSpec changes never edit
  docs/product/model directly. Product-definition work and implementation work
  have independent cadence: an OpenSpec change may share a pull request with an
  applied Product Change or follow an accepted definition later, but it remains
  a downstream implementation concern and never supplies Product Change status.

  <!-- pdac:context end -->
rules:
  proposal:
    - State which PDaC artifacts this change touches, each with an inline
      citation emitted by `npx prodshape cite --id <ID> --digest <digest>`.
      Never write a citation record by hand.
    - If the change implements altered product behaviour, name the Product
      Change (CHG id) whose applied or accepted artifacts it implements. If no
      overlay-validated and human-approved Product Change exists yet, stop and
      ask for one instead of proceeding. The OpenSpec change is not the Product
      Change.
    - "Every document of this change must end up bound or exempt: bind by citing
      the canonical text it depends on, or declare `pdac-scope: none` on a line
      of its own (frontmatter or `<!-- pdac-scope: none -->`) when a human
      judges the document has no product-semantic dependency. Never declare an
      exemption just because citations are missing."
    - "Identifying the impacted artifacts is a dedicated step before proposal
      content is written, and it is semantic first: read the entire product
      definition under the model root (docs/product/model by default), compare
      this change's motivating intent and goals — the backlog item that started
      it, if one exists — against it, and identify every artifact this change
      depends on, alters or contradicts. Then expand the set structurally: run
      `npx prodshape impact <ID>` on each identified artifact and walk the
      reported direct and transitive neighbours. Record the impacted set in the
      proposal, cite every impacted artifact from each document that derives
      from it (proposal, specs, design, tasks), and list any
      examined-but-excluded neighbour so the exclusion is visible, never
      silent."
    - "If this change's goals contradict the accepted product definition, or
      require behaviour it does not carry, that is product-definition drift:
      record it in the proposal as an explicit warning under a 'Product
      definition drift' note naming the artifacts involved, carried by the
      marker `<!-- pdac-drift ids=\"<ID>[, <ID>...]\" summary=\"<one line>\"
      -->` on a line of its own so `npx prodshape drift` can enumerate it, and
      leave the resolution to humans — the developer and the product owner agree
      whether to propose a Product Change or adapt this change. Never resolve
      drift silently, drop or weaken a citation to hide it, or paraphrase around
      the conflict."
  specs:
    - Every requirement derived from canonical product text MUST carry a
      citation to every PDaC artifact it derives from, one citation per line,
      placed after the requirement text and before the first scenario. A
      requirement often derives from more than one artifact; citing only the
      closest one silently hides the other derivations. Never place citations
      between the requirement heading and the requirement text; OpenSpec reads
      the first paragraph as the requirement.
    - Cite a specific verification scenario with an anchor when the requirement
      maps to one (anchor="<scenario id>").
    - Never paraphrase canonical text as if it were new; either cite it inline
      or embed it in a marker-block citation (<!-- pdac:cite ... --> canonical
      text <!-- /pdac:cite -->).
    - Never invent artifact ids or digests. Read them with `npx prodshape
      inspect <ID>`.
  design:
    - When a design decision depends on canonical product text, cite the
      artifact it depends on.
  tasks:
    - A task that changes cited behaviour must include a follow-up task to
      refresh the affected citations.
    - Never infer implementation, verification, release or deployment from
      Product Change status; record that evidence in the delivery workflow.
operations:
  apply:
    guidance:
      - "Before finishing, run `npx prodshape citations verify --provider
        openspec` and fix every stale, tampered or unresolved citation, every
        unclassified document and every bound document without citations.
        Refresh a stale digest by re-running `npx prodshape inspect <ID>`; never
        delete a citation or declare `pdac-scope: none` to silence a
        diagnostic."
  archive:
    guidance:
      - Run `npx prodshape citations verify --provider openspec` one final time.
        Archive only when every document is bound or exempt and every citation
        is current.
