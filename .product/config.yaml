schema: product-definition-as-code/config/v1alpha1
product:
  root: docs/product
  model: docs/product/model
  changes: docs/product/changes
generated:
  root: .product/generated
  commit: false
integrations:
  ai:
    - claude
    - copilot
  sdd:
    provider: openspec
  # This repository documents /ps:* publicly (README, CHANGELOG) and ships the aliases, so it opts
  # in. New installations default to false: for a single-assistant repository the aliases double
  # the command namespace without adding a capability.
  shorthand-commands: true
validation:
  warnings-as-errors: false
  require-journey-for-use-case: false
  require-requirement-reachability: true
