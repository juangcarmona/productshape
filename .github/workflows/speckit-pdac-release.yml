# Release pipeline for the ProductShape Spec Kit extensions.
#
# Trigger: pushing a tag `speckit-<id>-v<version>` whose version matches that extension's extension.yml.
# It builds the archive with `git archive` (the layout the specify CLI installs), creates the
# GitHub release with the asset, then opens a pull request that updates the installable catalog
# (extensions/catalog.json) with the new version, the pinned download URL and the archive's
# sha256, which the specify CLI verifies before installing. The catalog PR is opened rather than
# pushed to main so a human reviews and accepts what `specify extension update` will start
# serving; the release itself is immutable either way.
name: speckit extension release

on:
  push:
    tags: ['speckit-pdac-v*', 'speckit-pdac-product-v*']

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: check the tag matches the manifest version
        run: |
          EXT_ID="${GITHUB_REF_NAME#speckit-}"
          EXT_ID="${EXT_ID%-v*}"
          TAG_VERSION="${GITHUB_REF_NAME#speckit-${EXT_ID}-v}"
          MANIFEST_VERSION="$(node -e "const {parse}=require('yaml');const {readFileSync}=require('node:fs');const id=process.argv[1];process.stdout.write(parse(readFileSync('extensions/speckit-'+id+'/extension.yml','utf8')).extension.version)" "$EXT_ID")"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "tag version $TAG_VERSION does not match $EXT_ID extension.yml version $MANIFEST_VERSION"
            exit 1
          fi
          echo "EXT_ID=$EXT_ID" >> "$GITHUB_ENV"
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
      - name: build the extension archive
        run: |
          git archive "$GITHUB_REF_NAME:extensions/speckit-$EXT_ID" --format=zip -o "speckit-$EXT_ID.zip"
          sha256sum "speckit-$EXT_ID.zip" | cut -d' ' -f1 > "speckit-$EXT_ID.zip.sha256"
          echo "sha256: $(cat "speckit-$EXT_ID.zip.sha256")"
      # Idempotent on purpose: a tag pushed with git has no release yet, so one is created; a tag
      # created through the GitHub releases UI (the only way from a browser) arrives with its
      # release already existing, so the asset is uploaded to it instead (issue #149).
      - name: create or complete the GitHub release with the asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "speckit-$EXT_ID.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "speckit-$EXT_ID.zip" \
              --title "$EXT_ID Spec Kit extension ${TAG_VERSION}" \
              --notes "Spec Kit extension release. Install: specify extension add $EXT_ID (with the ProductShape catalog added), or specify extension add $EXT_ID --from the attached archive URL. sha256: $(cat "speckit-$EXT_ID.zip.sha256")"
          fi
      - name: open the catalog update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="speckit-$EXT_ID-catalog-v${TAG_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          node scripts/update-speckit-catalog.mjs "$EXT_ID" "$TAG_VERSION" "$(cat "speckit-$EXT_ID.zip.sha256")"
          git add extensions/catalog.json
          git commit -m "chore: serve speckit-$EXT_ID v${TAG_VERSION} from the extension catalog"
          git push -u origin "$BRANCH" --force-with-lease
          gh pr create --base main --head "$BRANCH" \
            --title "Serve speckit-$EXT_ID v${TAG_VERSION} from the extension catalog" \
            --body "Automated by the Spec Kit extension release workflow for tag ${GITHUB_REF_NAME}. Updates extensions/catalog.json to version ${TAG_VERSION} with the pinned release asset URL and its sha256. Merging makes the version visible to specify extension add $EXT_ID and specify extension update."
