name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The OpenSpec CLI ships as @fission-ai/openspec; the bare `openspec` npm package is an
      # unrelated empty placeholder with no bin. Pinned so a version bump is a deliberate change,
      # not a drifting CI surface. The consumer-install tests spawn the bare `openspec` command.
      - name: install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.11.0
      # The Spec Kit CLI (specify) drives the real-workspace suite in
      # tests/conformance/speckit-consumer.test.ts; the fixture suite guards the same contract
      # without it. Pinned to the supported v1.0.4 commit so an upstream Spec Kit change is a
      # deliberate bump, not a drifting CI surface.
      - name: install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: install Spec Kit CLI
        shell: bash
        run: |
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@cb610277fdea781fcfa83d20522c2db37c94068d
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
          echo "PRODSHAPE_REQUIRE_SPECKIT=1" >> "$GITHUB_ENV"
      - run: pnpm typecheck
      # Build before test: the packed-tarball test installs the built CLI package
      # (dist/ + staged schemas/assets) into a clean directory and runs its binaries.
      - run: pnpm build
      - run: pnpm test
      # Self-application: the repository must satisfy its own methodology. The built CLI bundles
      # its data files, so it runs from dist/bin.js after `pnpm build`.
      - name: prodshape validate
        run: node packages/cli/dist/bin.js validate
      # Conformance requires every live Product Change to satisfy the change contract, so the
      # gate runs whether or not one happens to be in flight on this branch.
      - name: prodshape change validate
        run: node packages/cli/dist/bin.js change validate
      - name: prodshape graph
        run: node packages/cli/dist/bin.js graph
      - name: prodshape doctor
        run: node packages/cli/dist/bin.js doctor
      # The citation gate this repository tells adopters to run (.product/integrations/
      # openspec.ci.yml): every current OpenSpec consumer document must be bound or exempt,
      # and every citation must verify against the self-hosted model.
      - name: prodshape citations verify
        run: node packages/cli/dist/bin.js citations verify --provider openspec
      - name: managed integrations up to date
        run: node packages/cli/dist/bin.js integration update --check

  quality:
    name: lint and format (docs-only checks run once)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm lifecycle:check
      - run: pnpm release-workflow:check

  release-contract:
    name: packed release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release-contract:smoke

  # Warn when a PR touches package source but adds no changeset. Deliberately never fails during
  # v0.x — it only emits an annotation.
  changesets:
    name: changeset reminder (warn only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: changeset status
        run: |
          pnpm changeset status --since=origin/${{ github.base_ref }} \
            || echo "::warning::No changeset found for changed packages. Run 'pnpm changeset' if this change should be released."
