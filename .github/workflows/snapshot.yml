name: Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a newer merge supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: publish the self-model snapshot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The snapshot browser rendered over this repository's own product model —
      # the same output `prodshape graph --format html` gives any adopter.
      - name: generate the snapshot
        run: node packages/cli/dist/bin.js graph --format html
      - name: stage the site
        run: |
          mkdir -p _site
          cp .product/generated/snapshot.html _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
