name: Engineering portal

on:
  pull_request:
    paths:
      - '.github/workflows/snapshot.yml'
      - 'docs/architecture/**'
      - 'docs/product/model/**'
      - 'src/packages/**'
      - 'src/scripts/build-public-site.mjs'
      - 'src/scripts/build-legacy-public-content.mjs'
      - 'src/scripts/validate-public-site.mjs'
      - 'src/scripts/check-public-site-browser.mjs'
      - 'src/public-site/assets/**'
      - 'src/public-site/content/**'
      - 'src/public-site/src/**'
      - 'src/public-site/astro.config.mjs'
      - 'src/public-site/diagrams/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; a newer merge supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build ProductShape engineering outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: generate the product explorer
        run: node src/packages/cli/dist/bin.js graph --format html --product-url https://productshape.dev
      - name: identify engineering snapshot sources
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p .product/generated/engineering
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';

          const sourceRevision = process.env.SOURCE_REVISION;
          if (!sourceRevision) throw new Error('SOURCE_REVISION is required.');
          const manifest = {
            schemaVersion: 2,
            productSnapshot: { sourceRevision },
            architectureSnapshot: { sourceRevision },
            e2eReports: [],
          };
          await writeFile(
            '.product/generated/engineering/manifest.json',
            `${JSON.stringify(manifest, null, 2)}\n`,
          );
          NODE
      - name: Build compatibility visual baseline
        run: node src/scripts/build-legacy-public-content.mjs --profile engineering --out engineering-baseline --base-path /productshape/ --site-origin https://juangcarmona.github.io --snapshot-source .product/generated/snapshot.html --engineering-manifest .product/generated/engineering/manifest.json
      - name: assemble the engineering portal
        env:
          MERMAID_RENDER: '1'
        run: node src/scripts/build-public-site.mjs --profile engineering --out _site --base-path /productshape/ --site-origin https://juangcarmona.github.io
      - name: Validate the engineering directory
        run: node src/scripts/validate-public-site.mjs --dir _site --profile engineering --base-path /productshape/ --site-origin https://juangcarmona.github.io
      - name: Run engineering browser regression checks
        run: node src/scripts/check-public-site-browser.mjs --dir _site --baseline-dir engineering-baseline --profile engineering --base-path /productshape/ --evidence-dir engineering-browser-evidence
      - name: Upload engineering browser regression evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: productshape-engineering-browser-${{ github.sha }}
          path: engineering-browser-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Upload the engineering review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: productshape-engineering-${{ github.sha }}
          path: _site
          if-no-files-found: error
          retention-days: 7
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  publish:
    name: Publish ProductShape engineering portal
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
