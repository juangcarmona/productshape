name: Public site

on:
  pull_request:
    paths:
      - 'src/public-site/**'
      - 'src/scripts/build-public-site.mjs'
      - 'src/scripts/build-legacy-public-content.mjs'
      - 'src/scripts/validate-public-site.mjs'
      - 'src/scripts/check-public-site-browser.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'docs/adoption/**'
      - 'docs/assets/snapshot/**'
      - 'docs/product/model/**'
      - '.github/workflows/public-site.yml'
      - 'wrangler.jsonc'
  push:
    branches: [main]
    paths:
      - 'src/public-site/**'
      - 'src/scripts/build-public-site.mjs'
      - 'src/scripts/build-legacy-public-content.mjs'
      - 'src/scripts/validate-public-site.mjs'
      - 'src/scripts/check-public-site-browser.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'docs/adoption/**'
      - 'docs/assets/snapshot/**'
      - 'docs/product/model/**'
      - '.github/workflows/public-site.yml'
      - 'wrangler.jsonc'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('productshape-public-site-pr-{0}', github.event.pull_request.number) || 'productshape-public-site' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build public site for review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the public site
        env:
          MERMAID_RENDER: '1'
        run: node src/scripts/build-public-site.mjs --profile public --out dist/public-site --base-path / --site-origin https://productshape.dev
      - name: Validate the public upload directory
        run: node src/scripts/validate-public-site.mjs --dir dist/public-site --profile public --base-path / --site-origin https://productshape.dev
      - name: Build compatibility visual baseline
        run: node src/scripts/build-legacy-public-content.mjs --profile public --out dist/public-site-baseline --base-path / --site-origin https://productshape.dev
      - name: Run public browser regression checks
        run: node src/scripts/check-public-site-browser.mjs --dir dist/public-site --baseline-dir dist/public-site-baseline --profile public --base-path / --evidence-dir dist/public-site-browser
      - name: Upload browser regression evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: productshape-public-site-browser-${{ github.sha }}
          path: dist/public-site-browser
          if-no-files-found: error
          retention-days: 7
      - name: Upload the review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: productshape-public-site-${{ github.sha }}
          path: dist/public-site
          if-no-files-found: error
          retention-days: 7
