name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    name: fixtures, self-model and traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Conformance fixtures, schema/template/example conformance, the self-hosted
      # model and the dogfooding traceability fixture all live in the repo project.
      - run: npx vitest run --project repo
      - name: openspec validation
        run: npx --yes openspec validate --all --no-interactive
