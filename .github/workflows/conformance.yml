name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    name: fixtures, self-model and traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The packed-tarball test in the repo project installs the built CLI package.
      - run: pnpm build
      # Conformance fixtures, schema/template/example conformance, the self-hosted
      # model and the dogfooding traceability fixture all live in the repo project.
      - run: npx vitest run --project repo
      # The OpenSpec CLI ships as @fission-ai/openspec; the bare `openspec` npm package is an
      # unrelated empty placeholder with no bin. Pin the real package for a reproducible check.
      - name: openspec artifact validation
        run: npx --yes @fission-ai/openspec@1.3.0 validate --all --no-interactive
