name: Release

# Publishing happens only here, never from a developer machine. Authentication prefers npm
# Trusted Publishing (OIDC) and falls back to the NPM_TOKEN secret while trusted publishers are
# still being configured. See RELEASING.md for the full process, tracks and rollback.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        default: publish
        options:
          - publish # prepare a Version Packages PR for pending alpha/beta changesets
          - publish-current-prerelease # publish versions already committed to main but absent from npm
          - pre-enter-alpha # start an alpha pre-release train
          - pre-enter-beta # start a beta pre-release train
          - pre-exit # return to the stable train

# Never let two releases run at once; do not cancel an in-flight publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; each job widens only what it needs.
permissions: {}

jobs:
  # Resolve pre-release mode in a runner step because hashFiles is not available in a job-level if.
  release-mode:
    name: determine release mode
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: mode
        shell: bash
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "mode=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "mode=stable" >> "$GITHUB_OUTPUT"
          fi

  # Keep the "Version Packages" PR up to date whenever changesets are pending on main.
  version-pr:
    name: maintain version PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm run version` ends in `integration update`, which regenerates every configured
      # integration of the self-hosted model; the OpenSpec adapter shells out to the `openspec`
      # CLI, which the runner does not carry. Same major the adapter's own error message names.
      - run: npm install -g @fission-ai/openspec@1
      # `version` only: this job manages the release PR and never publishes.
      # changesets/action runs the `version:` command via @actions/exec, not a shell — it does
      # NOT support `&&` chaining (the string is naively tokenized and any extra words are
      # forwarded as literal CLI arguments to `changeset`, which then errors "Too many arguments").
      # This must stay a single command; the chain lives in the "version" package.json script
      # instead, since npm/pnpm always run a script's body through a real shell.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm run version
          commit: 'chore: Version Packages'
          title: 'Version Packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stable publish: runs only when a "Version Packages" release commit lands on main and the repo
  # is not in pre-release mode. Gated by the protected `npm-publish` environment, which requires a
  # maintainer to approve the deployment before anything reaches npm.
  publish-stable:
    name: publish stable
    needs: release-mode
    if: >-
      github.event_name == 'push' && needs.release-mode.outputs.mode == 'stable' && startsWith(github.event.head_commit.message, 'chore: Version Packages')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # push git tags
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Refuse to publish stable while a pre-release train is active.
      - name: guard against pre mode
        shell: bash
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "::error::.changeset/pre.json present — exit pre mode before a stable release"
            exit 1
          fi
      # Green build is a hard gate for any publish.
      - run: pnpm build
      - run: pnpm typecheck
      # The full suite includes a separately named real-OpenSpec conformance lane. Managed
      # integration reconciliation itself does not require this executable; this install makes
      # the real-CLI lane explicit instead of allowing it to disappear on release runners.
      - name: install OpenSpec CLI for real conformance
        run: npm install -g @fission-ai/openspec@1.11.0
      - run: pnpm test
      - run: pnpm release-contract:smoke
      # `changeset publish` tags each published package with `git tag <name> -m <name>` — an
      # ANNOTATED tag, which git refuses to create without a committer identity. This job has its
      # own checkout and configures none, so every tag creation failed; `tagPublish` discards the
      # boolean `git.tag` returns, so it failed silently after already logging "New tag:". The
      # v0.2.0 release published six packages and pushed zero tags, and the log looked clean.
      - name: configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Publishes only packages whose version is ahead of npm, in dependency order, with provenance.
      - name: publish
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # fallback; ignored when OIDC is configured
          NPM_CONFIG_PROVENANCE: 'true'
      # `--tags` rather than `--follow-tags`: this job never advances `main` (the Version Packages
      # merge already did), so there is no ref for tags to "follow". Already-present tags are a
      # no-op.
      #
      # Then verify rather than trust. A push that reports "Everything up-to-date" is
      # indistinguishable from a successful one, which is exactly how the silent failure above
      # survived a previous attempt to fix it: the push flag was corrected while the real fault was
      # that no tags existed to push.
      - name: push tags
        shell: bash
        run: |
          git push origin --tags
          missing=0
          while read -r name version; do
            tag="${name}@${version}"
            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "::error::published ${tag} but its tag is not on the remote"
              missing=1
            fi
          done < <(pnpm -r --json list --depth -1 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s))if(p.name&&p.name.startsWith("@prodshape/"))console.log(p.name,p.version)})')
          exit "$missing"
      # Post-publish supply-chain verification.
      - name: verify signatures and provenance
        run: pnpm -r exec npm audit signatures || true
      # Tell pdac.dev to rebuild so it never lags this release's version. Mirrors how the spec
      # repository's notify-site.yml dispatches to the site: GITHUB_TOKEN is scoped to this
      # repository and cannot dispatch to another one, so this needs a token of its own, a
      # fine-grained PAT with Contents write on the site repository, stored here as
      # SITE_DISPATCH_TOKEN. This is a separate secret from the spec repository's copy; GitHub
      # secrets do not cross repositories.
      #
      # A missing token fails the job rather than skipping quietly, same as the spec repository's
      # version. Only the stable train reaches this job; alpha/beta publishes run through the
      # `dispatch` job below and never trigger this step.
      - name: notify pdac.dev of release
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SITE_DISPATCH_TOKEN is not set. Create a fine-grained PAT with Contents: write on product-definition-as-code/product-definition-as-code.github.io and add it as a repository secret."
            exit 1
          fi
          version=$(node -p "require('./packages/cli/package.json').version")
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/product-definition-as-code/product-definition-as-code.github.io/dispatches \
            -d "{\"event_type\":\"prodshape-released\",\"client_payload\":{\"version\":\"${version}\"}}")
          # 204 is the only success the dispatch API returns. Anything else, including a 200 with a
          # body, means the event was not accepted, and pdac.dev keeps serving a stale version.
          if [ "$code" != "204" ]; then
            echo "::error::dispatch was not accepted (HTTP $code)"
            cat response.txt
            exit 1
          fi
          echo "prodshape-released dispatched for ${version}"
          echo "### Asked pdac.dev to rebuild for \`${version}\`" >> "$GITHUB_STEP_SUMMARY"

  # A prerelease is published only from the merged version commit. Repository state therefore
  # becomes authoritative before npm and tags change, and reruns safely skip immutable versions.
  publish-prerelease:
    name: publish prerelease
    needs: release-mode
    if: >-
      github.event_name == 'push' && needs.release-mode.outputs.mode == 'prerelease' && contains(github.event.head_commit.message, 'Version Packages')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # The full suite includes a separately named real-OpenSpec conformance lane. Managed
      # integration reconciliation itself does not require this executable; this install makes
      # the real-CLI lane explicit instead of allowing it to disappear on release runners.
      - name: install OpenSpec CLI for real conformance
        run: npm install -g @fission-ai/openspec@1.11.0
      - run: pnpm test
      - run: pnpm release-contract:smoke
      - name: configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: publish prerelease packages
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: synchronize and verify prerelease tags
        shell: bash
        run: |
          if ! git push origin --tags; then
            echo "::error::npm publication succeeded, but tag synchronization failed"
            echo "Re-run this workflow after tag push access is restored; immutable npm versions will be skipped."
            exit 1
          fi
          missing=0
          while read -r name version; do
            tag="${name}@${version}"
            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "::error::published ${tag} but its tag is not on the remote"
              missing=1
            fi
          done < <(pnpm -r --json list --depth -1 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s))if(p.name&&p.name.startsWith("@prodshape/"))console.log(p.name,p.version)})')
          if [ "$missing" -ne 0 ]; then
            echo "::error::npm publication succeeded, but repository tag synchronization is incomplete"
            echo "Re-run this workflow after tag push access is restored; immutable npm versions will be skipped."
            exit 1
          fi

  # Recovery only: publish prerelease versions already committed to main when a previous publish
  # stopped before `changeset publish`. This job deliberately has no branch or PR permissions and
  # never runs `changeset version`; the repository commit is already the source of truth.
  publish-current-prerelease:
    name: publish current prerelease
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'publish-current-prerelease'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: install pinned external tools
        run: |
          npm install -g @fission-ai/openspec@1.11.0
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@cb610277fdea781fcfa83d20522c2db37c94068d
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
          echo "PRODSHAPE_REQUIRE_SPECKIT=1" >> "$GITHUB_ENV"
      - name: verify current main and build publication plan
        shell: bash
        run: |
          git fetch --tags --force origin main
          git checkout --detach origin/main
          echo "Publishing exact main commit $(git rev-parse HEAD)"
          set +e
          node scripts/check-prerelease-publication.mjs | tee prerelease-publication-plan.md
          status=${PIPESTATUS[0]}
          set -e
          cat prerelease-publication-plan.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm release-contract:smoke
      - name: configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: publish current prerelease packages
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: push and verify prerelease tags and npm versions
        shell: bash
        run: |
          git push origin --tags
          missing=0
          while read -r name version; do
            tag="${name}@${version}"
            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "::error::expected tag ${tag} is not on the remote"
              missing=1
            fi
            if ! npm view "${name}@${version}" version --json >/dev/null 2>&1; then
              echo "::error::expected npm version ${name}@${version} is not published"
              missing=1
            fi
          done < <(pnpm -r --json list --depth -1 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s))if(p.name&&p.name.startsWith("@prodshape/"))console.log(p.name,p.version)})')
          exit "$missing"

  # Manual path: prerelease publishing (alpha/beta), recovery, and pre-mode management.
  dispatch:
    name: manual (${{ github.event.inputs.task }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Same protected environment as publish-stable. It carries the npm publish credentials — the
    # environment-scoped token and the OIDC environment claim the npm trusted publisher requires —
    # so every publish PUT from this job authenticates. Without it npm returns E404 (it masks an
    # unauthorized publish as "not found"), which is exactly how the first manual `publish` failed.
    # It also gates every dispatch task behind maintainer approval, which is correct: publishing and
    # entering/exiting a pre-release train are both releases.
    environment: npm-publish
    permissions:
      contents: write # push release branches
      id-token: write # OIDC trusted publishing
      pull-requests: write # open the protected-main release PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # `pnpm run version` ends in `integration update`, which regenerates every configured
      # integration of the self-hosted model; the OpenSpec adapter shells out to the `openspec`
      # CLI, which the runner does not carry. Same major the adapter's own error message names.
      - name: install OpenSpec CLI for versioning
        run: npm install -g @fission-ai/openspec@1.11.0
      - name: configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Enter / exit a pre-release train through a PR. main is protected, so this job must never
      # attempt to update it directly.
      - name: enter alpha
        if: github.event.inputs.task == 'pre-enter-alpha'
        run: |
          if [ ! -f .changeset/pre.json ]; then pnpm changeset pre enter alpha; fi
          pnpm exec prettier --write .changeset/pre.json
          git add -A
          git commit -m "chore: enter alpha pre-release mode" || true
          branch="release/pre-enter-alpha-${GITHUB_RUN_ID}"
          git switch -C "$branch"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "chore: enter alpha pre-release mode" --body "Enter alpha prerelease mode through the protected-main release path." || gh pr view "$branch" --web=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: enter beta
        if: github.event.inputs.task == 'pre-enter-beta'
        run: |
          if [ ! -f .changeset/pre.json ]; then pnpm changeset pre enter beta; fi
          pnpm exec prettier --write .changeset/pre.json
          git add -A
          git commit -m "chore: enter beta pre-release mode" || true
          branch="release/pre-enter-beta-${GITHUB_RUN_ID}"
          git switch -C "$branch"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "chore: enter beta pre-release mode" --body "Enter beta prerelease mode through the protected-main release path." || gh pr view "$branch" --web=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: exit pre mode
        if: github.event.inputs.task == 'pre-exit'
        run: |
          if [ -f .changeset/pre.json ]; then pnpm changeset pre exit; fi
          if [ -f .changeset/pre.json ]; then pnpm exec prettier --write .changeset/pre.json; fi
          git add -A
          git commit -m "chore: exit pre-release mode" || true
          branch="release/pre-exit-${GITHUB_RUN_ID}"
          git switch -C "$branch"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "chore: exit pre-release mode" --body "Exit prerelease mode through the protected-main release path." || gh pr view "$branch" --web=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Versioning is separate from publication. The version commit must be merged into protected
      # main before npm is touched, otherwise a rejected main push can leave npm ahead of Git.
      # `pnpm run version` bumps, rebuilds and regenerates the self-hosted integration lock in one
      # step (see the root "version" script) — the same path the automated version-pr job uses, so
      # the self-hosted repo's `.product/installation.lock.json` never goes stale from either path.
      - name: prepare prerelease version PR
        if: github.event.inputs.task == 'publish'
        run: |
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm release-contract:smoke
          pnpm run version
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changesets were consumed; main already contains the current version state."
            echo "No Version Packages PR was created. Use publish-current-prerelease only when npm is missing a committed prerelease."
            echo "### No prerelease version diff" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -A
          git commit -m "chore: Version Packages (prerelease)"
          branch="release/version-prerelease-${GITHUB_RUN_ID}"
          git switch -C "$branch"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "chore: Version Packages (prerelease)" --body "Publish the prerelease version from this merged release commit." || gh pr view "$branch" --web=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
