schema: product-definition-as-code/delivery-slice/v1alpha1
id: SLI-EXPLORER-002
title: Read an artifact and every canonical relationship it holds
status: completed
product-change: CHG-SNAPSHOT-004
outcome: >-
  The selected artifact dominates the Reader: identity, type, status, metadata and the author's canonical
  content, with every canonical relationship grouped by its actual meaning, direction distinguished where
  it matters, complete counts on every group, and every related artifact one step from becoming the new
  focus. Deep links, Back/Forward and preserved navigation context make the model navigable as a graph
  through reading alone — no node-link diagram required.
implements:
  - requirement: FR-SNAPSHOT-002
    coverage: full
  - requirement: FR-SNAPSHOT-006
    coverage: partial
    scope: >-
      Navigation-context preservation around reading: moving focus to a related artifact and returning
      restores where the reader was, including an active Catalog discovery; deep links open on the
      artifact; Back/Forward retrace selections in order. The Catalog's addressable query state is
      delivered by SLI-EXPLORER-001; the Focused Topology's disclosure state by SLI-EXPLORER-003.
  - requirement: QR-SCALABILITY-001
    coverage: partial
    scope: >-
      The reader operations this slice delivers, measured at the three representative scales on the named
      environment: opening an artifact (longest body, most connected), reading its relationships, moving
      focus to a related artifact, and back/forward navigation. Hard-case readability re-verified:
      highest-degree, isolated, and long-title-and-body artifacts.
  - requirement: QR-PRESENTATION-001
    coverage: partial
    scope: >-
      The presentation contract confirmed on the Reader as this slice delivers it: identifiers
      monospaced, density preserved with the relationship groups present, no prohibited treatment
      introduced, recorded as screenshots at desktop and narrow viewports.
  - requirement: QR-ACCESSIBILITY-001
    coverage: partial
    scope: >-
      Every capability this slice reshapes: relationship groups reachable and expandable by keyboard,
      complete counts exposed to assistive technology, aria-current on the selected artifact wherever it
      appears, deliberate focus placement when the selection moves, contrast on everything added.
affects:
  - UC-SNAPSHOT-EXPLORE-001
  - JRN-SNAPSHOT-001
  - TERM-PRODUCT-EXPLORER
depends-on:
  - SLI-EXPLORER-001
verification:
  - A selected artifact shows its identity, type, status, remaining metadata and authored Markdown with
    the author's heading hierarchy; no other artifact's body is present in the document.
  - Declared and derived relationships appear as separately labelled groups by relationship meaning,
    direction explicit where it matters, each group carrying its complete count, each entry naming the
    related artifact's title and identifier and selectable in one step.
  - An isolated artifact reports both directions empty and reads normally; the most connected artifact's
    groups are counted rather than spilled.
  - Following a relationship makes the target the new focus everywhere; Back returns to the previous
    artifact with the reader's prior context — including an in-progress Catalog discovery — intact.
  - >-
    Every relationship of the compiled graph is reachable by reading alone: walking the Reader's
    groups accounts for every edge that touches each inspected artifact.
  - Selection, reading and traversal latency are measured at the three representative scales and
    recorded; nothing degrades materially across the range.
  - >-
    The reader's navigation context is visible and retraceable from the Reader: arriving from a
    Catalog discovery, the way back is apparent without relying on browser chrome alone, and Back
    restores it.
  - The whole reading flow is keyboard-operable with visible focus; authored content containing markup
    displays as text and never executes; regeneration from identical content remains byte-identical and
    browser storage stays empty.
out-of-scope:
  - The Focused Topology; SLI-EXPLORER-003.
  - Any behaviour beyond FR-SNAPSHOT-002's proposed contract; the Reader is delivered exactly as the
    change defines it.
  - Any npm release, package bump or changeset.
