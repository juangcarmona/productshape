schema: product-definition-as-code/delivery-slice/v1alpha1
id: SLI-SNAPSHOT-002
title: A connected, explorable Product Snapshot
status: completed
product-change: CHG-SNAPSHOT-001
outcome: >-
  A Product Explorer can follow any artifact's relationships in both directions as navigable links — including the derived reverse views no authored file states — see the product's shape in a graph visualization where selecting a node highlights its relationships, and search the whole model by ID, title or content, all inside the same single offline file.
implements:
  - requirement: FR-SNAPSHOT-002
    coverage: partial
    scope: >-
      Bidirectional relationship navigation (declared references and derived reverse views as links), the graph visualization with node-selection highlighting of an artifact's neighborhood, and client-side search over IDs, titles and content. Browsing by kind, rendered content and status badges are covered by SLI-SNAPSHOT-001.
affects:
  - UC-SNAPSHOT-EXPLORE-001
  - JRN-SNAPSHOT-001
depends-on:
  - SLI-SNAPSHOT-001
verification:
  - From a use case's rendered view, an outgoing reference (for example a governing business rule) and an incoming derived reference (for example a requirement deriving from it) are both followable as links, without the reader knowing which side authored the edge.
  - The graph visualization presents the model's overall shape; selecting one node highlights that artifact's relationships and navigates or links to its rendered view.
  - With the browser offline, searching for an artifact's ID, a word from its title and a term from its body each return the matching artifacts as navigable results.
  - Every capability works from the same single self-contained file produced by generation, still byte-identical across regenerations from identical content.
out-of-scope:
  - Structural impact analysis views; reachability questions beyond one artifact's direct neighborhood belong to a later change.
  - Rendering active Product Changes, Delivery Slices or Product Handoffs.
  - Any editing, annotation or approval capability, and any hosting or serving mechanism.
