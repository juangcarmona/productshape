schema: product-definition-as-code/delivery-slice/v1alpha1
id: SLI-SNAPSHOT-005
title: Ranked offline search
status: completed
product-change: CHG-SNAPSHOT-002
outcome: >-
  A Product Explorer who already knows what they are looking for finds it by typing, with the browser
  offline: an exact identifier lands first, a partial identifier outranks title text, titles outrank
  bodies, and when more matches exist than the page shows it says how many rather than hiding them.
  Selecting a result makes that artifact the page's single selection, clearing the query returns to
  browsing without losing it, and a query that matches nothing says so.
implements:
  - requirement: FR-SNAPSHOT-004
    coverage: full
  - requirement: FR-SNAPSHOT-002
    coverage: partial
    scope: >-
      The remaining property of the master area: the artifact list becomes searchable as well as
      reachable by kind and narrowed by filters, so a reader reaches any artifact by query as well as
      by browsing; and the absence of any create, edit, annotate, approve or persist capability in the
      search surface this slice adds. Everything else in the master-detail experience is covered by
      SLI-SNAPSHOT-003 and SLI-SNAPSHOT-004.
  - requirement: FR-SNAPSHOT-006
    coverage: partial
    scope: >-
      Convergence of search results on the single selected-artifact state owned by the navigation
      mechanism delivered in SLI-SNAPSHOT-003: selecting a result updates that selection and the
      address through the same mechanism and introduces no second source of navigation state.
      Convergence of relationship links is covered by SLI-SNAPSHOT-004 and of graph projections by
      SLI-SNAPSHOT-006.
  - requirement: CON-NO-WEB-UI
    coverage: partial
    scope: >-
      The restated boundary for the surface this slice introduces: search runs entirely against data
      already embedded in the file, with no server, no runtime process, no network request and no
      external resource; the query and its results are not persisted outside the address of the
      current view; and a typed query is input that changes only what is displayed, never product
      knowledge — the case the constraint's boundary was restated to settle.
  - requirement: QR-ACCESSIBILITY-001
    coverage: partial
    scope: >-
      Every surface this slice introduces: the search field and result list placed in the landmark and
      heading structure SLI-SNAPSHOT-003 established without skipping a level; reaching the field,
      moving through results, selecting a result and clearing the query entirely by keyboard, with no
      trapped focus and no pointer-only control; visible focus throughout and deliberate focus
      placement when a result becomes the selection; results, the match count when results are
      limited, and the no-results state all exposed to assistive technology; accessible name for an
      icon-only clear control; WCAG 2.1 AA contrast for every text-and-background pair introduced
      here including any match highlighting; nothing in a result carried by colour alone; no essential
      hover-only information in a result; and no non-essential animation under a reduced-motion
      preference. Verified against both the current-model and larger-model snapshots.
  - requirement: QR-PRESENTATION-001
    coverage: partial
    scope: >-
      The search field, result list and snippets realized within the system SLI-SNAPSHOT-003
      established: monospaced identifiers in results, each result's kind carried in text alongside the
      same stable per-kind palette, the same single accent for focus and selection, thin borders,
      deliberate alignment with the surrounding master area, square or low-radius field and controls,
      compact result density, and none of the prohibited treatments. Recorded as screenshots at
      desktop and narrow viewports for both representative models.
  - requirement: QR-SCALABILITY-001
    coverage: partial
    scope: >-
      Applied through the harness and reference environment established in SLI-SNAPSHOT-003, extended
      here for search. Covers search latency measured and recorded for each representative model — a
      query matching one artifact, a query matching roughly a tenth of the model, and a query matching
      every artifact — reported as a distribution, confirmed not to degrade materially from the current
      model to the largest representative model, with the evidence-based search-latency budget set from
      those figures and agreed before this slice's implementation is approved; and the opening document
      still containing no artifact body with the file-size and generation-time ratios still not
      increasing with model size once the search index is embedded.
affects:
  - UC-SNAPSHOT-EXPLORE-001
  - JRN-SNAPSHOT-001
depends-on:
  - SLI-SNAPSHOT-003
verification:
  - With networking disabled, typing an artifact identifier exactly puts that artifact first.
  - Typing a partial identifier such as `FR-SNAPSHOT` places every artifact whose identifier begins
    with it above artifacts matched only by title or body.
  - Typing `product` against the current baseline places artifacts whose titles begin with "Product" —
    including the "Product Snapshot" term — above artifacts matched only in their bodies, and the page
    states that 73 artifacts match. The pre-change behaviour, which showed 20 in document order and
    silently hid 53 including every title match, is gone.
  - A phrase appearing only inside one artifact's body finds that artifact and shows a snippet
    containing the phrase.
  - A snippet drawn from an artifact body containing a script tag and quote characters displays them
    as text; nothing executes and no element is created from the snippet.
  - Each result identifies its artifact by identifier, title and kind, and matching by kind returns the
    artifacts of that kind.
  - Reaching the field, moving through results, selecting one and clearing the query are all done
    entirely by keyboard; the selected artifact becomes the page's single selection and the address
    updates through the same navigation mechanism.
  - Clearing the query resumes browsing with the previously selected artifact still selected.
  - A query matching nothing produces an explicit no-results state that repeats the query searched
    for.
  - The same query against two snapshots generated from identical model content on different
    platforms returns results in identical order.
  - Results, the total match count when display is limited, and the no-results state are exposed to
    assistive technology; visible focus is present at every stop and lands deliberately when a result
    becomes the selection; every text-and-background pair introduced here passes WCAG 2.1 AA; nothing
    in a result depends on colour or hover alone; and with reduced motion set no non-essential
    animation runs.
  - Recorded screenshots at both viewports, for both representative models, confirm the search surface
    follows the presentation system established in SLI-SNAPSHOT-003.
  - Search involves no server, runtime process, network request or external resource; the query is not
    persisted outside the address; browser storage and cookies remain empty.
  - Search latency is measured for all three representative models on the reference environment, the
    figures recorded in full including the slowest cases, confirmed not to degrade materially with
    model size, and the search-latency budget is derived from them and agreed before this slice's
    implementation is approved.
  - Regenerating from identical model content still produces a byte-identical file, and the opening
    document still contains no artifact body.
out-of-scope:
  - Fuzzy matching, stemming, synonym expansion and relevance scoring beyond the ranking order
    FR-SNAPSHOT-004 states; the ranking is deterministic and specified, not learned or tuned.
  - Semantic or AI-assisted search over the model.
  - Searching anything the snapshot does not contain — repository history, active Product Changes,
    Delivery Slices or Handoffs.
  - Latency budgets for interactions this slice does not introduce; artifact selection belongs to
    SLI-SNAPSHOT-003 and focused-projection rendering to SLI-SNAPSHOT-006.
