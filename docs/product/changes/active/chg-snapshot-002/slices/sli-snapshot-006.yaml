schema: product-definition-as-code/delivery-slice/v1alpha1
id: SLI-SNAPSHOT-006
title: Focused neighbourhood and the layered model map
status: approved
product-change: CHG-SNAPSHOT-002
outcome: >-
  A Product Explorer can see what they have been reading. The focused neighbourhood draws the selected
  artifact's one-hop relationships with incoming told apart from outgoing and every edge naming its
  type, and the layered model map places real artifacts in four fixed bands as the snapshot's
  broad-topology view — filtering, grouping and collapsing to stay legible, and stating exactly how
  much it is holding back. Selecting a node anywhere moves the same single selection, and with the
  final surface in place the whole exploration progression is confirmed coherent end to end. No view
  draws the whole graph at once.
implements:
  - requirement: FR-SNAPSHOT-002
    coverage: partial
    scope: >-
      The graph portion of the master-detail invariants, first implementable and verifiable here
      because graph-driven selection first exists in this slice. When a node selection in either
      projection changes the artifact, exactly one artifact detail remains active with no other
      artifact's content present in the document, and the master area's visible selected state
      follows that change and persists while the reader works — the same single selected-artifact
      state that artifact browsing (SLI-SNAPSHOT-003), search (SLI-SNAPSHOT-005) and relationship
      navigation (SLI-SNAPSHOT-004) drive, not a parallel one. Also the absence of any create, edit,
      annotate, approve or persist capability in the projection surfaces this slice adds. The list,
      artifact body and metadata rendering, escaping, relationship groups, reachability and
      responsive behaviour are covered by SLI-SNAPSHOT-003, SLI-SNAPSHOT-004 and SLI-SNAPSHOT-005.
  - requirement: FR-SNAPSHOT-005
    coverage: partial
    scope: >-
      The two visual projections and the three-projection boundary: the focused neighbourhood anchored
      on the selected artifact at one hop with incoming distinguished from outgoing other than by
      colour and every edge naming its relationship type; the layered model map with its fixed
      product-owned band assignment — Product context (Actors, Bounded Contexts), Product behaviour
      (Journeys, Use Cases), Rules and language (Business Rules, Domain Terms), Product commitments
      (Functional Requirements, Quality Requirements, Constraints) — carrying no lifecycle, causality,
      sequence, precedence or direction, preserving every relationship's authored direction across and
      counter to band order, rendering only populated bands, supporting filtering, grouping, collapsing
      with exact hidden counts, node selection and fit-to-view, and never rendering every node and edge
      by default for a large model; grouping and collapsing of high-degree focused neighbours in the
      visual; the confirmation that exactly three projections exist and no unstructured whole-model
      drawing does; drawing nothing absent from the compiled graph and implying no importance, health,
      ownership or ordering; and deterministic arrangement for identical model content. The kind-level
      aggregate is covered by SLI-SNAPSHOT-003 and the always-available non-visual relationship list by
      SLI-SNAPSHOT-004.
  - requirement: FR-SNAPSHOT-006
    coverage: partial
    scope: >-
      Convergence of graph projections on the single selected-artifact state owned by the navigation
      mechanism delivered in SLI-SNAPSHOT-003, and the graph mode as part of the addressable state:
      selecting a node updates that selection and the address, a projection holds no selection of its
      own, and the active graph mode is represented in the address so a projection view is directly
      linkable and restored by Back and Forward. With this slice every consumer FR-SNAPSHOT-006 names —
      browsing, search results, relationship links and graph projections — converges on one state, and
      that convergence is confirmed in a single pass across all four.
  - requirement: CON-NO-WEB-UI
    coverage: partial
    scope: >-
      The restated boundary for the surfaces this slice introduces, and its confirmation across the
      completed page: both projections render from data already embedded in the file with no server, no
      runtime process, no network request and no external resource at any point in a full exploration
      pass; filter, collapse, zoom, pan and fit state is not persisted outside the address of the
      current view, and no node position a reader adjusts is retained; and no projection offers any
      capability to create, modify, annotate, approve or promote anything.
  - requirement: QR-ACCESSIBILITY-001
    coverage: partial
    scope: >-
      Every surface this slice introduces, plus the two checks that only become possible once the final
      surface exists. For the projections: their placement in the landmark and heading structure without
      skipping a level; complete keyboard operation of node selection, filtering, grouping, collapsing,
      expanding and fit-to-view with no trapped focus and no pointer-only control; visible focus within
      a projection and deliberate focus placement when a node selection changes the artifact; expanded,
      collapsed and selected state exposed to assistive technology as state; accessible names for
      icon-only projection controls such as fit, filter and zoom; relationship direction and artifact
      kind determinable with colour removed; no essential hover-only information on a node or edge; the
      SLI-SNAPSHOT-004 relationship list remaining available as the equivalent for anyone who cannot use
      the visual; and no non-essential layout transition under a reduced-motion preference. Additionally,
      with every surface now present: the complete exploration progression — orient, search, select, read,
      read relationships in both directions, expand a collapsed group, open both projections, select a
      neighbouring node, return by Back — completed in one pass by keyboard alone with no focus lost
      across any transition; and the contrast sweep over every text-and-background pair the finished
      stylesheet can produce. Verified against both the current-model and larger-model snapshots.
  - requirement: QR-PRESENTATION-001
    coverage: partial
    scope: >-
      Both projections realized within the system SLI-SNAPSHOT-003 established: the stable
      per-artifact-kind palette applied identically to nodes with kind also carried by text or shape,
      monospaced identifiers on node labels, thin borders and deliberate alignment of bands and groups,
      the same single accent for selection, compact density, and none of the prohibited gradient, glass,
      illustration or hero-typography treatments. Additionally, with every view now present, the
      cross-view coherence check the requirement states: one accent colour across the whole page and each
      artifact kind rendered in the same colour in the orientation view, the artifact list, the artifact
      detail, the relationship groups, the search results and both projections — and identical again in a
      second snapshot generated from the same model content. Recorded as screenshots at desktop and
      narrow viewports for both representative models.
  - requirement: QR-SCALABILITY-001
    coverage: partial
    scope: >-
      Applied through the harness and reference environment established in SLI-SNAPSHOT-003, extended
      here for graph interactions. Covers focused-projection latency measured and recorded for each
      representative model, for the highest-degree artifact and for an isolated artifact, reported as a
      distribution, confirmed not to degrade materially with model size, with the evidence-based
      focused-projection budget set from those figures and agreed before this slice's implementation is
      approved; the layered map confirmed not to render every node and edge for the largest
      representative model, reporting exact collapsed and hidden counts instead; high-degree readability
      inside a projection at every measured scale; and the opening document still containing no
      artifact-level graph with the file-size and generation-time ratios still not increasing with model
      size once projection data is embedded.
affects:
  - UC-SNAPSHOT-EXPLORE-001
  - JRN-SNAPSHOT-001
  - TERM-GRAPH-PROJECTION
  - TERM-PRODUCT-SNAPSHOT
  - CON-NO-GRAPH-DATABASE
depends-on:
  - SLI-SNAPSHOT-004
  - SLI-SNAPSHOT-005
verification:
  - The snapshot is inspected for its projections. Exactly three exist — kind-level aggregate, layered
    model map, focused neighbourhood — and no control anywhere opens an unstructured drawing of the
    whole model.
  - Selecting a use case and opening the focused projection shows an unmistakable anchor, incoming and
    outgoing relationships told apart without relying on colour, and each edge naming its relationship
    type; one hop is shown by default.
  - The layered map for the current baseline places actors and bounded contexts in Product context,
    journeys and use cases in Product behaviour, business rules and domain terms in Rules and
    language, and functional requirements, quality requirements and constraints in Product
    commitments.
  - The same band assignment appears in a snapshot generated from an unrelated product model with
    different kind proportions, with nothing in either file or its configuration able to change it.
  - Nothing in the layered map states or implies that one band precedes, causes, depends on or
    supersedes another. A relationship from a functional requirement to a use case and one from a use
    case to a domain term both display their authored direction regardless of band order.
  - The layered map opened for the largest representative model does not render every node and edge; it
    offers filtering and grouping and states the exact number of artifacts and relationships collapsed
    or hidden, and expanding a group reveals exactly that number.
  - A snapshot generated from a model with no bounded contexts renders only the bands the model
    populates, with no empty or invented band.
  - Selecting a node in either projection makes that artifact the page's single selection and updates
    the address including the active graph mode; a projection view is directly linkable; leaving the
    projection keeps the artifact selected; Back and Forward restore both the selection and the
    projection view.
  - In one pass, an artifact selected from the list, then found through search, then reached through a
    relationship link, then selected as a node in a projection all produce the same single selection,
    with the selected state visible wherever the artifact appears.
  - After a node selection in either projection changes the artifact, exactly one artifact detail is
    active, inspecting the document confirms no other artifact's body is present, and the master
    area's selected state has followed the change and persists as the reader continues working.
  - No projection surface offers any capability to create, edit, annotate, approve or persist
    anything.
  - Hiding or disabling the visual projection leaves every incoming and outgoing relationship of the
    selected artifact readable with type and direction through the SLI-SNAPSHOT-004 list.
  - Both projections are fully operable by keyboard, including node selection, filtering, collapsing,
    expanding and fitting; icon-only controls report accessible names; expanded, collapsed and selected
    state is exposed as state; nothing on a node or edge is hover-only; with reduced motion set, no
    non-essential transition runs.
  - The complete exploration progression is completed in one pass using only the keyboard, with visible
    focus at every stop and no focus lost across any view or selection change; landmarks and the heading
    outline are reviewed across all views together with no region unlabelled and no level skipped.
  - Every text-and-background pair the finished stylesheet can produce is computed against WCAG 2.1 AA
    and passes, including the kind palette applied to text and to node labels; with colour removed,
    artifact kind, relationship direction, artifact status and selection remain determinable on every
    view.
  - The finished page uses one accent colour, and each artifact kind's colour is identical in the
    orientation view, the artifact list, the artifact detail, the relationship groups, the search
    results and both projections — and identical again in a second snapshot generated from the same
    model content. Screenshots at both viewports, for both representative models, are recorded.
  - Two snapshots generated from identical model content on different platforms produce identical
    projection arrangements, and the file remains byte-identical.
  - Every node, relationship and direction either projection draws is confirmed present in
    `prodshape graph` output, nothing else is drawn, and no importance, health, ownership or ordering is
    implied.
  - Focused-projection latency is measured for all three representative models on the reference
    environment, the figures recorded in full, confirmed not to degrade materially with model size, and
    the focused-projection budget derived from them and agreed before this slice's implementation is
    approved.
  - No server, runtime process, network request or external resource is involved at any point in a full
    exploration pass; filter, collapse, zoom and fit state is not persisted; browser storage and cookies
    remain empty; and the file is still exactly one self-contained HTML document working over `file://`
    with networking disabled and from ordinary static hosting.
out-of-scope:
  - Any unstructured whole-model graph view; removed from this change by product decision, with the
    layered model map taking the broad-topology role.
  - Multi-hop neighbourhood expansion beyond one hop by default; deeper reachability belongs to the
    impact-analysis capability.
  - Editing the graph, repositioning nodes persistently, or any layout the reader can save; the
    snapshot persists nothing beyond the address.
  - Adopter-configurable or per-model band assignment; the bands are fixed and product-owned, and a
    new artifact kind receives its band through a Product Change.
  - Latency budgets for interactions this slice does not introduce; artifact selection belongs to
    SLI-SNAPSHOT-003 and search to SLI-SNAPSHOT-005.
  - The artifact list, artifact body and metadata rendering, their escaping, the relationship groups
    and the responsive master-detail states; this slice carries only the graph portion of the
    master-detail invariants, delivered against the surfaces the earlier slices established.
