schema: product-definition-as-code/delivery-slice/v1alpha1
id: SLI-SNAPSHOT-004
title: Typed relationships in both directions, without a graph
status: approved
product-change: CHG-SNAPSHOT-002
outcome: >-
  A Product Explorer reading one artifact understands what it connects to and what connects to it —
  what the artifact itself declares, kept separate from the derived reverse references no authored
  file states — with each relationship naming its type and direction, each related artifact
  selectable in one step, high-degree groups collapsed with exact counts until asked to open, and
  artifacts holding no relationships saying so rather than appearing broken. All of it as text: no
  visualization is required to understand any relationship in the model.
implements:
  - requirement: FR-SNAPSHOT-002
    coverage: partial
    scope: >-
      The relationship half of the artifact detail: declared references and derived reverse
      references as two separately labelled groups, each entry naming the relationship type and
      direction, each related artifact selectable directly from the group without scrolling through a
      long document, reachability of every relationship in the compiled model, artifacts with no
      relationships reporting the absence in both directions rather than appearing incomplete,
      responsive behaviour of the relationship groups on narrow viewports, complete escaping of the
      related-artifact titles and relationship labels these groups render from embedded data, and the
      absence of any create, edit, annotate, approve or persist capability in the relationship
      surfaces this slice adds. The
      list, one-active-detail rule, artifact body and metadata rendering and their escaping,
      artifact reachability and read-only behaviour are covered by SLI-SNAPSHOT-003.
  - requirement: FR-SNAPSHOT-005
    coverage: partial
    scope: >-
      The always-available non-visual equivalent that the focused neighbourhood projection is required
      to have: the complete labelled list of the selected artifact's typed, directed relationships,
      grouped by relationship type and artifact kind, with groups large enough to overwhelm the view
      collapsed showing their exact counts and expanded only on reader action, drawing nothing absent
      from the compiled graph and implying no importance, health, ownership or ordering. The visual
      focused neighbourhood, the layered model map, node selection within a projection and the
      exactly-three-projections boundary are covered by SLI-SNAPSHOT-006; the kind-level aggregate by
      SLI-SNAPSHOT-003.
  - requirement: FR-SNAPSHOT-006
    coverage: partial
    scope: >-
      Convergence of relationship links on the single selected-artifact state owned by the navigation
      mechanism delivered in SLI-SNAPSHOT-003: following a declared or derived reference updates that
      selection and the address through the same mechanism and introduces no second source of
      navigation state, and Back returns through a sequence of followed relationships in reverse
      order while Forward retraces it. Convergence of search results is covered by SLI-SNAPSHOT-005
      and of graph projections by SLI-SNAPSHOT-006.
  - requirement: CON-NO-WEB-UI
    coverage: partial
    scope: >-
      The restated boundary for the surfaces this slice introduces: relationship groups and their
      expansion involve no server, no runtime process, no network request and no external resource;
      expansion and collapse state is not persisted outside the address of the current view; and no
      relationship group offers any capability to create, modify, annotate, approve or promote
      anything.
  - requirement: QR-ACCESSIBILITY-001
    coverage: partial
    scope: >-
      Every surface this slice introduces: relationship groups and collapsible neighbour groups
      carrying their own landmark or heading placement without skipping a level in the outline
      SLI-SNAPSHOT-003 established; complete keyboard operation of expanding, collapsing and
      following a relationship with no trapped focus and no pointer-only control; visible focus
      throughout and deliberate focus placement when a followed relationship changes the selection;
      expanded and collapsed state exposed to assistive technology as state rather than appearance;
      accessible names for this slice's icon-only expansion controls; WCAG 2.1 AA contrast for every
      text-and-background pair introduced here; relationship direction and relationship type
      determinable with colour removed; no essential hover-only information in a relationship entry;
      and no non-essential animation on expansion under a reduced-motion preference. Verified against
      both the current-model and larger-model snapshots.
  - requirement: QR-PRESENTATION-001
    coverage: partial
    scope: >-
      The relationship groups and collapsible groups realized within the system SLI-SNAPSHOT-003
      established, not a second visual language: monospaced identifiers, thin borders and alignment
      consistent with the existing regions, the same single accent, the same stable per-kind palette
      applied to related artifacts with kind also carried by text, relationship direction conveyed by
      text or position as well as any colour, compact density with orientation, list and the selected
      artifact's identity and relationships legible together on an ordinary desktop viewport, and none
      of the prohibited treatments. Recorded as screenshots at desktop and narrow viewports for both
      representative models.
  - requirement: QR-SCALABILITY-001
    coverage: partial
    scope: >-
      Applied through the harness and reference environment established in SLI-SNAPSHOT-003. Covers
      hard-case readability of relationships at every measured scale: the highest-degree artifact of
      each representative model — 27 relationships in the current baseline, 171 in the largest
      synthetic model — readable through grouping and collapsing with exact counts and nothing
      expanding unbidden; isolated artifacts reading normally and reporting the absence in both
      directions at every scale; the opening document still containing no artifact body and the
      file-size and generation-time ratios still not increasing with model size once relationship data
      is embedded; and artifact-selection latency re-measured against the budget agreed in
      SLI-SNAPSHOT-003 so rendering relationships does not regress it.
affects:
  - UC-SNAPSHOT-EXPLORE-001
  - JRN-SNAPSHOT-001
  - TERM-GRAPH-PROJECTION
  - BR-RELATIONSHIPS-001
depends-on:
  - SLI-SNAPSHOT-003
verification:
  - From a use case, the reader sees the governing business rule in the declared group and the
    functional requirement that derives from it in the derived group, and reaches either in one step
    without needing to know which side authored the edge.
  - Every relationship group entry names its relationship type and its direction explicitly, and both
    remain determinable with colour removed.
  - For every artifact in the model, the declared and derived groups together account for exactly the
    edges `prodshape graph` records for it — no edge missing, none invented, and no importance,
    health, ownership or ordering implied.
  - Selecting the most connected artifact in the current baseline (27 relationships) shows neighbours
    grouped by relationship type and artifact kind, with groups large enough to overwhelm the view
    collapsed and showing their exact counts; expanding one reveals exactly that number, and nothing
    expands until the reader expands it.
  - The same holds for the highest-degree artifact of the largest representative model (171
    relationships), and the page stays responsive while a group is expanded.
  - Selecting an artifact with no relationships — `CON-NO-WEB-UI` in the current baseline — reports
    the absence in both directions and reads normally, at every measured scale.
  - >-
    Related-artifact titles and relationship labels rendered from embedded data are escaped — a title
    containing a script tag or an attribute-injection fragment is displayed verbatim as text with
    nothing executed.
  - Following a relationship makes the target the page's single selected artifact and updates the
    address through the same navigation mechanism; following three in sequence and pressing Back
    three times returns through them in reverse order, and Forward retraces them.
  - Expanding a group, collapsing it and following a relationship are all operable by keyboard alone,
    with visible focus, deliberate focus placement after the selection changes, and expanded state
    exposed as state; icon-only expansion controls report accessible names; with a reduced-motion
    preference set, expansion runs without animation.
  - The relationship groups adapt on a narrow viewport without horizontal page scrolling, and every
    text-and-background pair introduced here passes WCAG 2.1 AA.
  - Recorded screenshots at both viewports, for both representative models, confirm the relationship
    groups follow the presentation system established in SLI-SNAPSHOT-003 — same accent, same per-kind
    palette, same borders and alignment — rather than introducing a second visual language.
  - No server, runtime process, network request or external resource is involved; expansion state is
    not persisted outside the address; browser storage and cookies remain empty.
  - Regenerating from identical model content still produces a byte-identical file; the opening
    document still contains no artifact body; and artifact-selection latency is re-measured on the
    reference environment and still meets the budget agreed in SLI-SNAPSHOT-003.
out-of-scope:
  - Any visual rendering of relationships; this slice delivers the textual equivalent that
    SLI-SNAPSHOT-006's focused neighbourhood projection is required to have.
  - Ranked search; SLI-SNAPSHOT-005 delivers it.
  - Relationships beyond one hop from the selected artifact; deeper reachability belongs to the
    impact-analysis capability, not the snapshot.
  - Changing which relationships exist or how they are derived; the groups render the compiled graph
    as it is, and reverse relationships remain derived rather than authored.
