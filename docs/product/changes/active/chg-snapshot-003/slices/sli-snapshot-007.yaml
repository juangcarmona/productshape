schema: product-definition-as-code/delivery-slice/v1alpha1
id: SLI-SNAPSHOT-007
title: The product landscape, proven at reference scale
status: proposed
product-change: CHG-SNAPSHOT-003
outcome: >-
  A Product Explorer enters one map and sees the complete product laid out in its four permanently visible
  semantic bands, with every artifact present as its own stable, individually reachable node — none
  anonymous, none omitted, and no scoping required to get there. Positions are derived from the model and do
  not move, so the landscape is a place the reader can start learning rather than a picture that is redrawn.
  It is verified to hold at the largest reference model scale, because whether it does determines whether
  everything built on it works.
implements:
  - requirement: FR-SNAPSHOT-005
    coverage: partial
    scope: >-
      The landscape state: one map replacing the layered map, four permanently visible bands with every
      artifact kind in its fixed product-owned band, only populated bands rendered, bands implying no
      lifecycle, sequence, precedence, causality, dependency or direction, every artifact present as a
      stable individually reachable node with its human-readable title as its identity at readable detail,
      no anonymous marks, no silent omission, no pre-scoping required, and no node drawn that the compiled
      graph does not contain. The focused state, relationship prominence and typed counted groups are
      covered by SLI-SNAPSHOT-008.
  - requirement: FR-SNAPSHOT-007
    coverage: partial
    scope: >-
      Stable placement and determinism: an artifact's position is derived from the compiled model alone, is
      identical for identical model content, and does not change when band scope changes. The camera
      behaviour, background retention on focus change, group-expansion stability and the reset action are
      covered by SLI-SNAPSHOT-008, which is where focus first exists.
  - requirement: QR-PRESENTATION-001
    coverage: partial
    scope: >-
      Landscape node presentation within the presentation system already established: the human-readable
      title as a node's primary identity whenever it is shown at readable detail, kind and identifier
      available as secondary information, artifact-kind colour as an accent rather than a large filled
      surface, and the background node state. Simultaneous legibility of every title across a whole-product
      fit is explicitly not an obligation and is not measured. The focused, selected, related and hovered
      states are covered by SLI-SNAPSHOT-008 and SLI-SNAPSHOT-009; the scoped-band state by
      SLI-SNAPSHOT-010.
  - requirement: QR-ACCESSIBILITY-001
    coverage: partial
    scope: >-
      The landscape as this slice introduces it: every node reachable and selectable by keyboard alone with
      no pointer-only path, visible focus on whichever node holds it, the landscape placed in the page's
      landmark and heading structure without skipping a level, band and kind conveyed by text or shape as
      well as colour, WCAG 2.1 AA contrast for every text-and-background pair introduced here, no
      information needed by a reader available only on hover, and no non-essential animation under a
      reduced-motion preference. Focus, selection, inspector and band-scope surfaces are covered by the
      three later slices.
  - requirement: QR-SCALABILITY-001
    coverage: partial
    scope: >-
      Landscape rendering and landscape integrity, measured on the named reference environment at all three
      defined reference model scales including the 730-artifact scale. Covers the five integrity properties
      for the landscape state — stable placement, individual reachability, successful selection and focus,
      interaction within measured budgets, and no clipping, overlap or inaccessible content — plus
      landscape-render latency recorded as a distribution with its evidence-based budget set from those
      figures, and confirmation that generated file size and generation time per artifact do not increase
      with model size. This evidence belongs to this slice rather than a later one because it determines
      whether the landscape is viable at all. Focus-transition and band-scope measurement are covered by
      SLI-SNAPSHOT-008 and SLI-SNAPSHOT-010; artifact-selection latency continues to bind its existing
      budget throughout.
affects:
  - UC-SNAPSHOT-EXPLORE-001
  - JRN-SNAPSHOT-001
  - TERM-PRODUCT-LANDSCAPE
  - TERM-GRAPH-PROJECTION
depends-on: []
verification:
  - The map opens on the landscape with all four bands visible, every artifact of the model present as its
    own node, none aggregated away and none anonymous, and no scoping required to enter.
  - >-
    Every artifact kind appears in its fixed band — actors and bounded contexts in Product context, journeys
    and use cases in Product behaviour, business rules and domain terms in Rules and language, and the three
    requirement kinds in Product commitments — and the same assignment appears in a snapshot generated from
    an unrelated product model with different kind proportions.
  - A model with no bounded contexts renders only the bands it populates, with no empty band shown and none
    invented.
  - Nothing in the landscape states or implies that one band precedes, causes, depends on or supersedes
    another.
  - >-
    A node viewed at readable detail identifies itself by its human-readable title, with kind and identifier
    available; its kind colour is an accent rather than a fill; and with colour removed, band and kind remain
    determinable.
  - Two snapshots generated from identical model content place every artifact identically, and every node
    the landscape draws exists in the compiled graph with nothing else drawn.
  - >-
    The landscape is fully operable by keyboard — every node can be reached and selected, focus is visible at
    every stop, and no needed information is hover-only.
  - Landmarks and the heading outline are extracted and reviewed with the landscape in place; no region is
    unlabelled and no heading level is skipped.
  - >-
    At each of the three defined reference model scales, on the named reference environment, the landscape is
    verified against the five integrity properties, and each result is recorded — including at the
    730-artifact scale, where stable placement, individual reachability, successful selection and focus,
    interaction within budget, and the absence of clipping, overlap or inaccessible content are each recorded
    with their figure or pass.
  - Landscape-render latency is measured across the three scales, reported as a distribution including the
    slowest cases, and its evidence-based budget is derived from those figures and recorded.
  - Generated file size per authored byte and generation time per artifact do not increase with model size,
    and regeneration from identical model content remains byte-identical.
out-of-scope:
  - The focused state, relationship prominence, typed counted groups, the camera, background retention and
    the reset action; SLI-SNAPSHOT-008 delivers them.
  - The three-region Explorer, the persistent inspector and the single selection operation;
    SLI-SNAPSHOT-009 delivers them.
  - Band scope as navigation state and the scoped-band visual state; SLI-SNAPSHOT-010 delivers them.
  - Aggregating, sampling or clustering artifacts in the landscape. Every artifact is individually
    represented; reducing that would be a separate product decision.
  - Any budget for interactions this slice does not introduce.
