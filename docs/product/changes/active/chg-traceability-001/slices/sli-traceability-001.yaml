schema: product-definition-as-code/delivery-slice/v1alpha1
id: SLI-TRACEABILITY-001
title: Validate requirement coverage before OpenSpec archive
status: completed
product-change: CHG-TRACEABILITY-001
outcome: >-
  A product engineer can run one deterministic command against an OpenSpec change and learn
  whether every requirement its handoff implements has resolvable specification and verification
  evidence, before the change is archived.
implements:
  - requirement: FR-COVERAGE-001
    coverage: full
affects:
  - UC-COVERAGE-001
  - JRN-SDD-HANDOFF-001
depends-on: []
verification:
  - An uncovered implemented requirement is reported with the documented error code and a failing exit.
  - Evidence paths that do not exist fail the check naming the path.
  - A fully covered SDD change passes and repeated runs produce the identical report.
out-of-scope:
  - Coverage evidence formats for SDD frameworks other than OpenSpec.
  - Automatic generation of coverage mappings.
