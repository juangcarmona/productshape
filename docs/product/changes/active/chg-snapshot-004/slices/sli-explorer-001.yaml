schema: product-definition-as-code/delivery-slice/v1alpha1
id: SLI-EXPLORER-001
title: Enter the Explorer, understand the aggregate, locate an artifact
status: proposed
product-change: CHG-SNAPSHOT-004
outcome: >-
  A reader opens the snapshot, understands the aggregate shape of the product from the Overview —
  identity, revision, counts by family, the kind-level relationship aggregate, search one gesture away —
  and locates any artifact through the Catalog: by identifier, title or content, by family, narrowed by
  canonical fields, with a deterministic result set whose address can be shared and whose state survives
  opening a result. Discovery at corpus scale becomes a workspace, not a lookup dialog.
implements:
  - requirement: FR-SNAPSHOT-003
    coverage: full
  - requirement: FR-SNAPSHOT-008
    coverage: full
  - requirement: FR-SNAPSHOT-006
    coverage: partial
    scope: >-
      The addressable Catalog: the active surface and the query-and-filter state carried in the fragment,
      deterministic and shareable, restored on open, preserved across opening a result and returning.
      The Focused Topology's disclosure state is covered by SLI-EXPLORER-003; the legacy-fragment
      guarantee and the unresolved-identifier state are re-verified rather than changed.
  - requirement: QR-SCALABILITY-001
    coverage: partial
    scope: >-
      The reader operations this slice delivers, measured on the named reference environment at the three
      representative scales: loading the Explorer to a usable Overview, and searching and filtering in
      the Catalog on its hardest cases. Figures recorded as distributions; budgets derived during
      technical design; existing agreed budgets continue to bind. Opening-document targets re-confirmed.
  - requirement: QR-PRESENTATION-001
    coverage: partial
    scope: >-
      The presentation contract confirmed on the surfaces this slice delivers: the Overview and the
      Catalog inspected against the calm text-first instrument obligations on the rendered page, at
      desktop and narrow viewports, recorded as screenshots for the current and corpus-scale models.
  - requirement: QR-ACCESSIBILITY-001
    coverage: partial
    scope: >-
      Every capability this slice introduces or reshapes — the Overview's family entry points and
      permanent search access, the Catalog's filters, result sets and state restoration — keyboard
      operable with visible focus, state exposed as state, WCAG 2.1 AA contrast on everything added,
      nothing hover-only, no non-essential animation under reduced motion.
affects:
  - UC-SNAPSHOT-EXPLORE-001
  - JRN-SNAPSHOT-001
  - TERM-PRODUCT-EXPLORER
depends-on: []
verification:
  - The snapshot opens on the Overview with no artifact body and no artifact-level graph, stating
    identity, revision, totals, per-family counts with entry points, the kind-level aggregate and the
    generated/read-only statement, with global search reachable without leaving the first screen.
  - Every canonical artifact family present in the model is enterable from the Overview; kinds the model
    lacks are neither mentioned nor zero-filled.
  - An artifact is located by exact identifier, by title fragment, by body phrase and by family
    browsing; filters narrow by type, status and bounded context where declared, and no invented filter
    exists.
  - The address of a query-and-filter state opened in a fresh window from local disk reproduces the same
    result set in the same order; opening a result and returning resumes the query, filters and results.
  - Loading and search/filter latency are measured at the three representative scales on the named
    environment and recorded in full; nothing degrades materially across the tenfold range.
  - The whole flow — orient, search, filter, open, return — is completed by keyboard alone with visible
    focus, and browser storage stays empty throughout.
  - Regeneration from identical model content remains byte-identical, and the Overview and Catalog are
    recorded as screenshots at desktop and narrow viewports for the current and corpus-scale models.
out-of-scope:
  - The Reader's contract and the relationship reading experience; SLI-EXPLORER-002.
  - The Focused Topology in any form; SLI-EXPLORER-003.
  - Any change to search ranking; FR-SNAPSHOT-004 is reused as-is.
  - Any npm release, package bump or changeset.
