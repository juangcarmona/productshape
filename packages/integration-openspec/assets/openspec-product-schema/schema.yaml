# MANAGED FILE. Installed by `prodshape integration add openspec` and regenerated by
# `prodshape integration update`. Hand edits are reported by `prodshape doctor` and replaced
# on the next update; remove the integration to take the schema out.
name: product
version: 1
description: >-
  PDaC product workflow hosted in OpenSpec: requested product intent becomes a Product Change delta against the accepted model in docs/product/model, deterministically validated as an overlay, then applied by the PDaC integration only for a change in the apply-authorised state. Requires OpenSpec >= 1.7.0. This schema changes product meaning only; implementation work belongs to a separate spec-driven change.
artifacts:
  - id: intent
    generates: proposal.md
    description: Requested product intent, grounded in the accepted product model
    template: proposal.md
    instruction: |
      Capture WHY the product definition should change, before any delta exists.

      Ground the intent in the accepted model:
      1. Read the accepted Product Definition (docs/product/model unless .product/config.yaml moves product-root).
         Never treat proposals, archived changes or OpenSpec documents as product truth.
      2. Compare the request with the whole definition, then widen through the product graph:
         for every artifact the request depends on, alters or contradicts, inspect its neighbours and impact.
         The repository's ProductShape tooling provides this deterministically: `prodshape inspect <ID>` and
         `prodshape impact <ID>` resolve the locally installed @prodshape/cli. Install the CLI locally
         (a devDependency counts) rather than relying on network resolution.
      3. List every impacted artifact in the proposal and name any neighbour you checked and left out.
      4. Cite the artifacts the intent stands on: read the digest with `prodshape inspect <ID>`, emit the
         payload with `prodshape cite --id <ID> --digest <digest>`, and wrap it in an HTML comment on its
         own line. Declare the document scope: `pdac-scope: cited` when the proposal carries citations, or
         `pdac-scope: none` with a non-empty human reason when no product text is involved.

      Decide the outcome honestly. When the request changes no product meaning (tooling, refactoring,
      delivery-only work), record that verdict under the "No product delta" heading and STOP: do not
      author a delta artifact and do not invent product change to satisfy the workflow. Otherwise state
      the intended product outcome in product language, not implementation language.
    requires: []

  - id: delta
    generates: 'product/**/*.md'
    description: The PDaC Product Change delta, change.md plus the complete proposed future state
    template: change.md
    instruction: |
      Author the PDaC Product Change under product/ in this change directory: product/change.md plus
      product/proposed/** holding the COMPLETE future state of every artifact the change adds or
      modifies, laid out exactly as it will live in the model (actors/, journeys/, use-cases/,
      business-rules/, behaviours/, domain/terms/, domain/bounded-contexts/, requirements/functional/,
      requirements/quality/, requirements/constraints/), each file named <lowercase-id>.md.

      Rules that make the delta valid:
      - change.md frontmatter carries id (CHG-...), type: product-change, title, status: draft,
        base-revision (the commit the change was authored against, `git rev-parse --short HEAD`, quoted),
        and operations with all three keys add, modify and remove. The body carries seven sections in
        order: Problem, Intended Product Outcome, Rationale, Affected Product Areas, Open Questions,
        Product Acceptance, Out of Scope.
      - Preserve stable IDs: evolve an existing artifact by listing its EXISTING id under
        operations.modify, never by adding a near duplicate under a new id. Create only the artifacts
        the intent requires.
      - Every id in operations.add and operations.modify has a complete proposed artifact under
        product/proposed/; nothing else appears there. Removals list existing ids and ship no files.
      - Use the exact current PDaC formats. `prodshape template <kind>` prints the authoring template
        for every kind (actor, journey, use-case, business-rule, domain-term, bounded-context,
        functional-requirement, quality-requirement, constraint, structured-behaviour); it resolves the
        locally installed @prodshape/cli.
      - Keep typed relationships resolvable: primary-actor, steps[].use-case, bounded-context,
        governed-by, uses-terms, applies-to, defined-in, derived-from, illustrates and
        verification[].scenario-ref must point at ids that exist in the baseline or in this delta.
      - Stay in product semantics: no file paths, package names or implementation detail inside product
        artifacts. Add a structured-behaviour only where it clarifies observable product behaviour
        (given/when/then in frontmatter, Intent and Boundaries body sections).
      - Leave status: draft while authoring. Status approved records human product approval under
        ProductShape's accepted policy; that decision happens outside this artifact, and neither
        this workflow nor the integration grants it.
      - Never edit docs/product/model directly; the accepted model changes only through the
        deterministic apply of this change.

      Preflight is available at any time:
      `node openspec/schemas/product/scripts/product-validate.mjs --change <change-name>` validates the
      accepted baseline plus this delta as an overlay without touching either.
    requires:
      - intent

apply:
  requires:
    - delta
  instruction: |
    Apply materializes the approved delta into docs/product/model. It is never implicit, never a
    commit and never an archive.

    1. Confirm the change is in the apply-authorised state: product/change.md carries
       status: approved. That protocol state is required for apply (PRODUCT028 otherwise); the
       integration checks only that protocol state. ProductShape's accepted policy requires human
       product approval; neither this workflow nor the integration grants, infers or judges it.
    2. Run the deterministic apply through the PDaC integration, dry run first:
       `node openspec/schemas/product/scripts/product-apply.mjs --change <change-name> --dry-run`
       then without --dry-run. The script resolves the locally installed
       @prodshape/integration-openspec and calls its apply rail, which re-reads the accepted model,
       revalidates this delta as an overlay at apply time, refuses on any blocking diagnostic with
       docs/product/model untouched, enforces base-revision drift (PRODUCT027) and the
       apply-authorised state (PRODUCT028), writes the delta into the model, reports the product diff
       computed from the result and flips this change's status to applied in place.
    3. Re-read docs/product/model and validate the resulting accepted model: `prodshape validate` must
       report zero errors. Refresh any citations the reported diff made stale.
    4. STOP. Do not archive this change as part of apply: archiving is a separate OpenSpec action
       performed after successful Product apply and verification. Do not implement delivery work, do
       not modify implementation code and never edit docs/product/model by hand.
