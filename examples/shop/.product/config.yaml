version: v1alpha1
product-root: docs/product
validation:
  warnings-as-errors: true
extensions:
  prodshape:
    generated:
      root: .product/generated
      commit: false
    integrations:
      ai: []
      shorthand-commands: false
    citations:
      # Directories `prodshape citations verify` scans when no target is given.
      consumer-roots:
        - openspec
        - .agents
        - src
        - tests
